[build]
  # Build command for Gatsby
  command = "npm run build"
  # Directory where Gatsby outputs the built site
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  # Node version for builds
  NODE_VERSION = "18"

# Branch-based deployments
[context.production]
  # Production branch (main)
  command = "npm run build"
  publish = "public"

[context.staging]
  # Staging branch
  command = "npm run build"
  publish = "public"

[context.deploy-preview]
  # Pull request previews
  command = "npm run build"
  publish = "public"

# Sanity Studio routes
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache Gatsby build files
[[headers]]
  for = "/page-data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/app-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/component-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables (set these in Netlify dashboard)
# SANITY_PROJECT_ID=bhfv0qe4
# SANITY_DATASET=production
# SANITY_READ_TOKEN=your_read_token_here
# GATSBY_SANITY_PROJECT_ID=bhfv0qe4
# GATSBY_SANITY_DATASET=production
# PUBLIC_BUILDER_KEY=your_builder_key_here

<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Line icons for the KRFI demo. Every symbol strokes in currentColor, so
       the page sets the colour. Referenced as icons.svg#name. -->

  <symbol id="percent" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="32" cy="32" r="29"/>
    <circle cx="24" cy="23" r="4.5"/>
    <circle cx="40" cy="41" r="4.5"/>
    <path d="M41 20 23 44"/>
  </symbol>

  <symbol id="pie" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <circle cx="32" cy="32" r="29"/>
    <path d="M32 3v29l17-23"/>
    <path d="M6 20h22M4 26h26M3 32h58M4 38h56M6 44h52M9 50h46M14 56h36"/>
  </symbol>

  <symbol id="clipboard" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
    <rect x="12" y="10" width="40" height="50" rx="1"/>
    <path d="M24 10V5h16v5M24 10v4h16v-4"/>
    <rect x="25" y="34" width="14" height="11" rx="1"/>
    <path d="M28 34v-4a4 4 0 0 1 8 0v4M32 38.5v3"/>
  </symbol>

  <symbol id="moneybag" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M25 18c-10 8-16 18-16 28 0 9 10 14 23 14s23-5 23-14c0-10-6-20-16-28"/>
    <path d="M25 18h14M26 18l-4-12 6 3 4-5 4 5 6-3-4 12"/>
    <path d="M32 54V34M25 41l7-7 7 7M28 54V42M36 54V42"/>
  </symbol>

  <symbol id="calendar" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <rect x="6" y="10" width="52" height="48" rx="1"/>
    <path d="M6 20h52M16 6v8M48 6v8"/>
    <path d="M12 27h40M12 33h40M12 39h40M12 45h40M12 51h40" stroke-dasharray="3 2"/>
  </symbol>

  <symbol id="house" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">
    <path d="M4 30 30 6l26 24M10 25v30h26"/>
    <path d="M42 12h6v12"/>
    <rect x="18" y="32" width="12" height="10"/>
    <path d="M24 32v10M18 37h12"/>
    <circle cx="48" cy="48" r="11"/>
    <path d="M51 42.5c-1-1-2-1.5-3-1.5-2 0-3 1.5-3 3.5V53m-2 0h9M43 47.5h6"/>
  </symbol>

  <symbol id="star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round">
    <path d="m12 2.5 2.8 6.2 6.7.7-5 4.5 1.4 6.6L12 17.1l-5.9 3.4 1.4-6.6-5-4.5 6.7-.7z"/>
    <path d="M9 12.5l2 2 4-4"/>
  </symbol>

  <symbol id="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="m7 10 5 5 5-5"/>
  </symbol>

  <symbol id="sort" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3 7 3-3 3 3M3 13l3 3 3-3"/>
  </symbol>

  <symbol id="arrow-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5m6-6-6 6 6 6"/>
  </symbol>

  <symbol id="arrow-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14m-6-6 6 6-6 6"/>
  </symbol>

  <symbol id="arrow-up-right" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 17 17 7M8 7h9v9"/>
  </symbol>

  <symbol id="download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v12m-5-5 5 5 5-5M5 21h14"/>
  </symbol>

  <symbol id="plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M12 5v14M5 12h14"/>
  </symbol>

  <symbol id="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M6 6l12 12M18 6 6 18"/>
  </symbol>

  <symbol id="menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
    <path d="M3 6h18M3 12h18M3 18h18"/>
  </symbol>

  <symbol id="check" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="10" fill="currentColor"/>
    <path d="m7.5 12.5 3 3 6-6.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>

  <!-- Side panel icons: drawn inside a ring, like the design. -->
  <symbol id="sp-download" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <path d="M16 9v11m-4.5-4.5L16 20l4.5-4.5M10.5 23h11"/>
  </symbol>

  <symbol id="sp-criteria" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <rect x="11" y="8.5" width="10" height="15" rx="1"/>
    <path d="M13.5 12.5h5M13.5 15.5h5M13.5 18.5h5"/>
  </symbol>

  <symbol id="sp-calculator" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <rect x="11" y="8.5" width="10" height="15" rx="1"/>
    <path d="M13 11.5h6M13.5 15h1M17.5 15h1M13.5 18h1M17.5 18h1M13.5 21h1M17.5 21h1"/>
  </symbol>

  <symbol id="sp-value" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <rect x="9" y="10" width="14" height="12" rx="1"/>
    <path d="M12.5 19v-3M16 19v-5M19.5 19v-4"/>
  </symbol>

  <symbol id="sp-bdm" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="16" cy="16" r="14"/>
    <circle cx="13" cy="13" r="3"/>
    <path d="M8 22c.5-3 2.5-5 5-5s4.5 2 5 5"/>
    <circle cx="20" cy="15" r="2.5"/>
    <path d="M22.5 20.5 25 23"/>
  </symbol>
</svg>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=402">
<title>Sample app</title>
<!--
  Placeholder mobile app for the Phone Demo block. It is built at the iPhone
  screen size, 402 x 874, and leaves the top 54px for the status bar.
  Parts a case study can point a note at carry data-annotate="name"; the note's
  "Points at" field in Sanity uses the same name. Names here: balance, actions,
  activity, vcard, freeze, sheet.
-->
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;background:#f3f4f8;color:#14161f;overflow:hidden}
.app{height:100%;display:flex;flex-direction:column}
.app::before{content:"";position:absolute;inset:0 0 auto;height:54px;background:rgba(243,244,248,.9);backdrop-filter:blur(12px);z-index:2}
.screen{flex:1;overflow-y:auto;padding:62px 20px 24px;display:none;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen.on{display:block}
h1{font-size:28px;margin:8px 0 16px}
.card{background:linear-gradient(135deg,#0b5d4b,#13a27e);color:#fff;border-radius:22px;padding:20px;margin-bottom:20px}
.card small{opacity:.8}.card b{display:block;font-size:34px;margin:6px 0 14px}
.actions{display:flex;gap:10px}
.actions button{flex:1;border:0;border-radius:14px;padding:12px 0;font:600 14px inherit;background:rgba(255,255,255,.18);color:#fff;cursor:pointer}
h2{font-size:15px;color:#6b7080;margin:6px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;cursor:pointer}
.row:active{background:#e8ebf2}
.row span:last-child{font-weight:600}.neg{color:#c0392b}.pos{color:#0b8a5e}
.tabs{display:flex;background:rgba(255,255,255,.94);border-top:1px solid #e2e4ea;padding:8px 0 34px}
.tabs button{flex:1;border:0;background:none;font:500 11px inherit;color:#8a8f9c;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabs button i{width:24px;height:24px;border-radius:7px;background:currentColor;opacity:.35}
.tabs button.on{color:#0b8a5e}.tabs button.on i{opacity:1}
.sheet{position:absolute;inset:auto 0 0;z-index:3;background:#fff;border-radius:24px 24px 0 0;padding:24px 20px 44px;transform:translateY(100%);transition:transform .3s ease;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
.sheet.on{transform:none}
.sheet h3{font-size:20px;margin-bottom:6px}.sheet p{color:#6b7080;margin-bottom:18px}
.sheet button{width:100%;border:0;border-radius:14px;padding:14px;font:600 16px inherit;background:#0b8a5e;color:#fff;cursor:pointer}
input{width:100%;font:inherit;font-size:16px;padding:14px;border:1px solid #d6d9e0;border-radius:12px;margin-bottom:12px}
</style></head><body><div class="app">
<section class="screen on" id="home"><h1>Good morning</h1>
<div class="card" data-annotate="balance"><small>Available balance</small><b>₦482,150.00</b>
<div class="actions" data-annotate="actions"><button data-sheet="Send money">Send</button><button data-sheet="Top up">Top up</button><button data-sheet="Pay bills">Bills</button></div></div>
<h2>Recent activity</h2><div id="list" data-annotate="activity"></div></section>
<section class="screen" id="cards"><h1>Cards</h1><div class="card" data-annotate="vcard"><small>Virtual card</small><b>•••• 4821</b><small>Tap a row below</small></div>
<div class="row" data-sheet="Freeze card" data-annotate="freeze"><span>Freeze card</span><span>›</span></div>
<div class="row" data-sheet="Change PIN"><span>Change PIN</span><span>›</span></div></section>
<section class="screen" id="profile"><h1>Profile</h1><h2>Try typing</h2><input placeholder="Full name"><input placeholder="Email" type="email"></section>
<nav class="tabs"><button class="on" data-tab="home"><i></i>Home</button><button data-tab="cards"><i></i>Cards</button><button data-tab="profile"><i></i>Profile</button></nav>
<div class="sheet" id="sheet" data-annotate="sheet"><h3></h3><p>A demo flow. Nothing is sent.</p><button>Done</button></div></div>
<script>
const items=[["Spotify",-1500],["Salary",350000],["Uber",-4200],["Shoprite",-18750],["Transfer from Ada",25000],["MTN airtime",-2000],["Netflix",-4400],["Bolt",-3100],["Refund",6000],["Jumia",-12900]];
document.getElementById('list').innerHTML=items.map(([n,v])=>`<div class="row" data-sheet="${n}"><span>${n}</span><span class="${v<0?'neg':'pos'}">${v<0?'−':'+'}₦${Math.abs(v).toLocaleString()}</span></div>`).join('');
const sheet=document.getElementById('sheet');
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');
 if(t){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('on',b===t));document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===t.dataset.tab));sheet.classList.remove('on');return}
 const s=e.target.closest('[data-sheet]');
 if(s){sheet.querySelector('h3').textContent=s.dataset.sheet;sheet.classList.add('on');return}
 if(e.target.closest('.sheet button'))sheet.classList.remove('on');
});
</script></body></html>
